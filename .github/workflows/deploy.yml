name: Continuous Integration & Build Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
        continue-on-error: true # cache fallback

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Compile check
        run: |
          cd backend
          npx prisma generate
          npm run build

  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
        continue-on-error: true

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Compile check
        run: |
          cd frontend
          npm run build
